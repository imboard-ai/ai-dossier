name: Publish Packages to npm

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

  release:
    types: [published]

  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump (patch, minor, major, or skip)'
        required: false
        default: 'skip'
        type: choice
        options:
          - skip
          - patch
          - minor
          - major

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: make build-all

      - name: Test
        run: make test

  smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: make build-all

      - name: Pack all packages
        run: |
          mkdir -p /tmp/tarballs
          for pkg in packages/core packages/sched cli mcp-server packages/worktree-pool; do
            (cd "$pkg" && npm pack --pack-destination /tmp/tarballs)
          done
          ls -1 /tmp/tarballs

      - name: Install tarballs into a fixture project
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke
          # `ls ... | head -1` guards against npm pack ever producing multiple
          # matching tarballs (e.g. versioned + tag-suffixed builds).
          CORE_TGZ=$(ls /tmp/tarballs/ai-dossier-core-*.tgz | head -1)
          SCHED_TGZ=$(ls /tmp/tarballs/ai-dossier-sched-*.tgz | head -1)
          CLI_TGZ=$(ls /tmp/tarballs/ai-dossier-cli-*.tgz | head -1)
          POOL_TGZ=$(ls /tmp/tarballs/ai-dossier-worktree-pool-*.tgz | head -1)
          # cli depends on @ai-dossier/core, @ai-dossier/sched and
          # @ai-dossier/worktree-pool (#561); sched also depends on
          # @ai-dossier/worktree-pool. Install every one of them via file: so
          # npm resolves the peers locally without needing registry versions
          # that this same workflow run hasn't published yet.
          cat > package.json <<EOF
          {
            "name": "smoke-fixture",
            "version": "0.0.0",
            "private": true,
            "dependencies": {
              "@ai-dossier/core": "file:$CORE_TGZ",
              "@ai-dossier/worktree-pool": "file:$POOL_TGZ",
              "@ai-dossier/sched": "file:$SCHED_TGZ",
              "@ai-dossier/cli":  "file:$CLI_TGZ"
            }
          }
          EOF
          npm install --no-audit --no-fund

      - name: Tier 1 — non-interactive smoke (each wrapped in timeout)
        run: |
          BIN=/tmp/smoke/node_modules/.bin/ai-dossier
          test -x "$BIN" || (echo "ai-dossier binary not executable at $BIN"; exit 1)

          echo "::group::ai-dossier --version"
          timeout 10s "$BIN" --version
          echo "::endgroup::"

          echo "::group::ai-dossier doctor"
          # `doctor` may exit non-zero for environment warnings (no MCP config,
          # missing claude binary on a clean runner). We only care that the
          # process exits within the timeout, not the diagnostic outcome.
          timeout 10s "$BIN" doctor || true
          echo "::endgroup::"

          echo "::group::ai-dossier whoami (with fixture token)"
          PAYLOAD=$(node -e "process.stdout.write(Buffer.from(JSON.stringify({sub:'smoke',orgs:[],exp:Math.floor(Date.now()/1000)+86400})).toString('base64url'))")
          # Inline env: token is scoped to this single command invocation only,
          # never visible to follow-on commands or hooks in this step.
          DOSSIER_REGISTRY_TOKEN="header.${PAYLOAD}.sig" \
            HOME="$(mktemp -d)" \
            timeout 10s "$BIN" whoami
          echo "::endgroup::"

      - name: Tier 2 — interactive login smoke (regression guard for #386)
        run: |
          BIN=/tmp/smoke/node_modules/.bin/ai-dossier
          test -x "$BIN" || (echo "ai-dossier binary not executable at $BIN"; exit 1)
          # smoke.mjs sets DOSSIER_LOGIN_ALLOW_NONINTERACTIVE=1 internally to
          # bypass login's TTY guard while exercising the full success path.
          node cli/test/smoke/login.smoke.mjs "$BIN"

  publish:
    needs: [test, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Full history: scripts/publish-guard.mjs diffs HEAD against the commit
          # each already-published version was built from (npm's gitHead).
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted-publishing AUTH (OIDC token used as the npm publish
      # credential) requires npm 11.5+. Node 22's bundled npm is 10.9.7,
      # which can sign provenance attestations but cannot authenticate
      # the publish PUT, so the registry returns 404.
      #
      # `npm install -g npm@latest` is broken on the current GH Actions
      # toolcache image (arborist's promise-retry is missing on the
      # global rebuild path). `corepack prepare npm@latest --activate`
      # doesn't shadow the bundled npm either. Workaround: install npm
      # into a local prefix (no global rebuild step) and prepend it to
      # PATH so the version that runs the publish steps is 11+.
      - name: Install npm 11+ to local prefix
        run: |
          npm install --prefix /tmp/npm-latest npm@latest
          echo "/tmp/npm-latest/node_modules/.bin" >> $GITHUB_PATH
          /tmp/npm-latest/node_modules/.bin/npm --version

      - name: Install dependencies
        run: npm ci

      - name: Bump version (manual dispatch only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != 'skip'
        run: |
          # Bump core version
          cd packages/core
          npm version ${{ github.event.inputs.version }} --no-git-tag-version
          CORE_VERSION=$(node -p "require('./package.json').version")
          echo "CORE_VERSION=$CORE_VERSION" >> $GITHUB_ENV

          # Bump CLI version
          cd ../../cli
          npm version ${{ github.event.inputs.version }} --no-git-tag-version
          npm pkg set "dependencies.@ai-dossier/core=^$CORE_VERSION"

          # Bump MCP server version
          cd ../mcp-server
          npm version ${{ github.event.inputs.version }} --no-git-tag-version

      - name: Commit and tag version bump
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != 'skip'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/core/package.json cli/package.json mcp-server/package.json
          VERSION=$(cd cli && node -p "require('./package.json').version")
          git commit -m "chore: bump version to $VERSION"
          git tag "v$VERSION"
          git push
          git push origin "v$VERSION"

      - name: Build all packages
        run: make build-all

      - name: Check if @ai-dossier/core needs publishing
        id: check-core
        run: node scripts/publish-guard.mjs --dir packages/core --defer-collision

      - name: Publish @ai-dossier/core
        if: steps.check-core.outputs.skip != 'true'
        run: |
          cd packages/core
          npm publish --provenance --access public

      # Before sched/cli: both depend on @ai-dossier/worktree-pool (#561), so
      # the registry must have it first or their installs break for users —
      # same reasoning as sched-before-cli below.
      - name: Check if @ai-dossier/worktree-pool needs publishing
        id: check-pool
        run: node scripts/publish-guard.mjs --dir packages/worktree-pool --defer-collision

      - name: Publish @ai-dossier/worktree-pool
        if: steps.check-pool.outputs.skip != 'true'
        run: |
          cd packages/worktree-pool
          npm publish --provenance --access public

      - name: Check if @ai-dossier/sched needs publishing
        id: check-sched
        run: node scripts/publish-guard.mjs --dir packages/sched --defer-collision

      # Before cli: a published cli tarball depends on @ai-dossier/sched, so
      # the registry must have it first or the cli install breaks for users.
      # A dependency held back by a collision holds its dependents too: they
      # would otherwise ship against the older published dependency (#826).
      - name: Publish @ai-dossier/sched
        if: >-
          steps.check-sched.outputs.skip != 'true' &&
          steps.check-core.outputs.collision != 'true' &&
          steps.check-pool.outputs.collision != 'true'
        run: |
          cd packages/sched
          npm publish --provenance --access public

      - name: Check if @ai-dossier/cli needs publishing
        id: check-cli
        run: node scripts/publish-guard.mjs --dir cli --defer-collision

      - name: Publish @ai-dossier/cli
        if: >-
          steps.check-cli.outputs.skip != 'true' &&
          steps.check-core.outputs.collision != 'true' &&
          steps.check-pool.outputs.collision != 'true' &&
          steps.check-sched.outputs.collision != 'true'
        run: |
          cd cli
          npm publish --provenance --access public

      - name: Check if @ai-dossier/mcp-server needs publishing
        id: check-mcp
        run: node scripts/publish-guard.mjs --dir mcp-server --defer-collision

      - name: Publish @ai-dossier/mcp-server
        if: >-
          steps.check-mcp.outputs.skip != 'true' &&
          steps.check-core.outputs.collision != 'true'
        run: |
          cd mcp-server
          npm publish --provenance --access public

      # A collision (version already on npm, built from different source) is
      # held until here so unaffected packages still publish; then the job fails
      # loudly instead of reporting a silent skip as success (#826). Dependents
      # of a colliding package were held above and publish once it is bumped.
      - name: Fail on version collisions
        if: >-
          steps.check-core.outputs.collision == 'true' ||
          steps.check-pool.outputs.collision == 'true' ||
          steps.check-sched.outputs.collision == 'true' ||
          steps.check-cli.outputs.collision == 'true' ||
          steps.check-mcp.outputs.collision == 'true'
        env:
          CORE: ${{ steps.check-core.outputs.collision }}
          POOL: ${{ steps.check-pool.outputs.collision }}
          SCHED: ${{ steps.check-sched.outputs.collision }}
          CLI: ${{ steps.check-cli.outputs.collision }}
          MCP: ${{ steps.check-mcp.outputs.collision }}
        run: |
          collided=""
          [ "$CORE" = "true" ] && collided="$collided @ai-dossier/core"
          [ "$POOL" = "true" ] && collided="$collided @ai-dossier/worktree-pool"
          [ "$SCHED" = "true" ] && collided="$collided @ai-dossier/sched"
          [ "$CLI" = "true" ] && collided="$collided @ai-dossier/cli"
          [ "$MCP" = "true" ] && collided="$collided @ai-dossier/mcp-server"
          echo "::error title=Version collision::Not released:$collided — each version is already on npm from different source (see the 'Check if ... needs publishing' logs). Bump them in a follow-up PR; every publish run fails this way until then."
          exit 1

  verify:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify packages are available on npm
        run: |
          echo "Verifying published packages..."
          npm view @ai-dossier/core version
          npm view @ai-dossier/sched version
          npm view @ai-dossier/cli version
          npm view @ai-dossier/mcp-server version
          npm view @ai-dossier/worktree-pool version
          # Behavioral smoke testing happens in the pre-publish `smoke` job
          # against the same tarball; this job only confirms registry publish.
