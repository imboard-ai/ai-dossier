name: Publish Packages to npm

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

  release:
    types: [published]

  workflow_dispatch:
    inputs:
      channel:
        description: Publish a prerelease cohort to next or committed stable versions to latest
        type: choice
        options:
          - next
          - stable
        default: next
        required: true

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: make build-all

      - name: Test
        run: make test

  smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: make build-all

      - name: Pack all packages
        run: |
          mkdir -p /tmp/tarballs
          for pkg in packages/core packages/sched cli mcp-server packages/worktree-pool; do
            (cd "$pkg" && npm pack --pack-destination /tmp/tarballs)
          done
          ls -1 /tmp/tarballs

      - name: Install tarballs into a fixture project
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke
          # `ls ... | head -1` guards against npm pack ever producing multiple
          # matching tarballs (e.g. versioned + tag-suffixed builds).
          CORE_TGZ=$(ls /tmp/tarballs/ai-dossier-core-*.tgz | head -1)
          SCHED_TGZ=$(ls /tmp/tarballs/ai-dossier-sched-*.tgz | head -1)
          CLI_TGZ=$(ls /tmp/tarballs/ai-dossier-cli-*.tgz | head -1)
          POOL_TGZ=$(ls /tmp/tarballs/ai-dossier-worktree-pool-*.tgz | head -1)
          # cli depends on @ai-dossier/core, @ai-dossier/sched and
          # @ai-dossier/worktree-pool (#561); sched also depends on
          # @ai-dossier/worktree-pool. Install every one of them via file: so
          # npm resolves the peers locally without needing registry versions
          # that this same workflow run hasn't published yet.
          cat > package.json <<EOF
          {
            "name": "smoke-fixture",
            "version": "0.0.0",
            "private": true,
            "dependencies": {
              "@ai-dossier/core": "file:$CORE_TGZ",
              "@ai-dossier/worktree-pool": "file:$POOL_TGZ",
              "@ai-dossier/sched": "file:$SCHED_TGZ",
              "@ai-dossier/cli":  "file:$CLI_TGZ"
            }
          }
          EOF
          npm install --no-audit --no-fund

      - name: Tier 1 — non-interactive smoke (each wrapped in timeout)
        run: |
          BIN=/tmp/smoke/node_modules/.bin/ai-dossier
          test -x "$BIN" || (echo "ai-dossier binary not executable at $BIN"; exit 1)

          echo "::group::ai-dossier --version"
          timeout 10s "$BIN" --version
          echo "::endgroup::"

          echo "::group::ai-dossier doctor"
          # `doctor` may exit non-zero for environment warnings (no MCP config,
          # missing claude binary on a clean runner). We only care that the
          # process exits within the timeout, not the diagnostic outcome.
          timeout 10s "$BIN" doctor || true
          echo "::endgroup::"

          echo "::group::ai-dossier whoami (with fixture token)"
          PAYLOAD=$(node -e "process.stdout.write(Buffer.from(JSON.stringify({sub:'smoke',orgs:[],exp:Math.floor(Date.now()/1000)+86400})).toString('base64url'))")
          # Inline env: token is scoped to this single command invocation only,
          # never visible to follow-on commands or hooks in this step.
          DOSSIER_REGISTRY_TOKEN="header.${PAYLOAD}.sig" \
            HOME="$(mktemp -d)" \
            timeout 10s "$BIN" whoami
          echo "::endgroup::"

      - name: Tier 2 — interactive login smoke (regression guard for #386)
        run: |
          BIN=/tmp/smoke/node_modules/.bin/ai-dossier
          test -x "$BIN" || (echo "ai-dossier binary not executable at $BIN"; exit 1)
          # smoke.mjs sets DOSSIER_LOGIN_ALLOW_NONINTERACTIVE=1 internally to
          # bypass login's TTY guard while exercising the full success path.
          node cli/test/smoke/login.smoke.mjs "$BIN"

  publish:
    needs: [test, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLISH_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'stable' && 'stable' || 'next' }}
      PUBLISH_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'stable' && 'latest' || 'next' }}
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Full history: scripts/publish-guard.mjs diffs HEAD against the commit
          # each already-published version was built from (npm's gitHead).
          fetch-depth: 0

      - name: Require main for stable publishing
        if: env.PUBLISH_CHANNEL == 'stable' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Stable publishing must be dispatched from main."
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted-publishing AUTH (OIDC token used as the npm publish
      # credential) requires npm 11.5+. Node 22's bundled npm is 10.9.7,
      # which can sign provenance attestations but cannot authenticate
      # the publish PUT, so the registry returns 404.
      #
      # `npm install -g npm@latest` is broken on the current GH Actions
      # toolcache image (arborist's promise-retry is missing on the
      # global rebuild path). `corepack prepare npm@latest --activate`
      # doesn't shadow the bundled npm either. Workaround: install npm
      # into a local prefix (no global rebuild step) and prepend it to
      # PATH so the version that runs the publish steps is 11+.
      - name: Install npm 11+ to local prefix
        run: |
          npm install --prefix /tmp/npm-latest npm@latest
          echo "/tmp/npm-latest/node_modules/.bin" >> $GITHUB_PATH
          /tmp/npm-latest/node_modules/.bin/npm --version

      - name: Install dependencies
        run: npm ci

      # Keep the stable-baseline checks available to publish-reconcile. The
      # next channel publishes its complete prerelease cohort regardless of
      # these outputs; the stable channel uses them to skip safe re-runs and
      # report collisions/unavailable checks before completing.
      - name: Check @ai-dossier/core stable baseline
        id: guard_core
        run: node scripts/publish-guard.mjs --dir packages/core --defer-collision "$RUNNER_TEMP/publish-collisions"

      - name: Check @ai-dossier/worktree-pool stable baseline
        id: guard_worktree_pool
        run: node scripts/publish-guard.mjs --dir packages/worktree-pool --defer-collision "$RUNNER_TEMP/publish-collisions"

      - name: Check @ai-dossier/sched stable baseline
        id: guard_sched
        run: node scripts/publish-guard.mjs --dir packages/sched --defer-collision "$RUNNER_TEMP/publish-collisions"

      - name: Check @ai-dossier/cli stable baseline
        id: guard_cli
        run: node scripts/publish-guard.mjs --dir cli --defer-collision "$RUNNER_TEMP/publish-collisions"

      - name: Check @ai-dossier/mcp-server stable baseline
        id: guard_mcp_server
        run: node scripts/publish-guard.mjs --dir mcp-server --defer-collision "$RUNNER_TEMP/publish-collisions"

      - name: Prepare next release cohort
        if: env.PUBLISH_CHANNEL == 'next'
        run: |
          # GITHUB_RUN_ATTEMPT makes a manual re-run a distinct npm version.
          node scripts/prepare-next-release.mjs --run-number "$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"

      - name: Build all packages
        run: make build-all

      - name: Publish @ai-dossier/core
        if: env.PUBLISH_CHANNEL == 'next' || steps.guard_core.outputs.skip != 'true'
        run: |
          cd packages/core
          npm publish --provenance --access public --tag "$PUBLISH_TAG"

      # Before sched/cli: both depend on @ai-dossier/worktree-pool (#561), so
      # the registry must have it first or their installs break for users —
      # same reasoning as sched-before-cli below.
      - name: Publish @ai-dossier/worktree-pool
        if: env.PUBLISH_CHANNEL == 'next' || steps.guard_worktree_pool.outputs.skip != 'true'
        run: |
          cd packages/worktree-pool
          npm publish --provenance --access public --tag "$PUBLISH_TAG"

      # Before cli: a published cli tarball depends on @ai-dossier/sched, so
      # the registry must have it first or the cli install breaks for users.
      - name: Publish @ai-dossier/sched
        if: env.PUBLISH_CHANNEL == 'next' || steps.guard_sched.outputs.skip != 'true'
        run: |
          cd packages/sched
          npm publish --provenance --access public --tag "$PUBLISH_TAG"

      - name: Publish @ai-dossier/cli
        if: env.PUBLISH_CHANNEL == 'next' || steps.guard_cli.outputs.skip != 'true'
        run: |
          cd cli
          npm publish --provenance --access public --tag "$PUBLISH_TAG"

      - name: Publish @ai-dossier/mcp-server
        if: env.PUBLISH_CHANNEL == 'next' || steps.guard_mcp_server.outputs.skip != 'true'
        run: |
          cd mcp-server
          npm publish --provenance --access public --tag "$PUBLISH_TAG"

      - name: Fail on stable publish guard problems
        if: env.PUBLISH_CHANNEL == 'stable'
        run: node scripts/publish-guard.mjs --report-collisions "$RUNNER_TEMP/publish-collisions"

  verify:
    needs: publish
    runs-on: ubuntu-latest
    env:
      PUBLISH_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'stable' && 'stable' || 'next' }}
      PUBLISH_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'stable' && 'latest' || 'next' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify packages are available under the selected channel
        run: |
          echo "Verifying $PUBLISH_CHANNEL packages..."
          for entry in \
            "packages/core:@ai-dossier/core" \
            "packages/worktree-pool:@ai-dossier/worktree-pool" \
            "packages/sched:@ai-dossier/sched" \
            "cli:@ai-dossier/cli" \
            "mcp-server:@ai-dossier/mcp-server"; do
            directory=${entry%%:*}
            package=${entry#*:}
            expected=$(node -p "require('./$directory/package.json').version")
            verified=false
            error_file="$RUNNER_TEMP/npm-view-error"

            for attempt in 1 2 3 4 5; do
              : > "$error_file"
              actual=$(npm view "$package@$PUBLISH_TAG" version --prefer-online 2>"$error_file") || actual=""
              if [ -n "$actual" ] && { [ "$PUBLISH_CHANNEL" = "next" ] || [ "$actual" = "$expected" ]; }; then
                echo "Verified $package@$PUBLISH_TAG at $actual"
                verified=true
                break
              fi

              actual_log=$(printf '%s' "$actual" | tr '\r\n' '  ' | sed 's/::/: :/g' | cut -c1-120)
              error_detail=$(tr '\r\n' '  ' < "$error_file" | sed 's/::/: :/g' | cut -c1-240)
              if [ -n "$actual_log" ]; then
                reason="resolved $actual_log"
              elif [ -n "$error_detail" ]; then
                reason="$error_detail"
              else
                reason="no version returned"
              fi

              if [ "$attempt" -eq 5 ]; then
                echo "::error::$package@$PUBLISH_TAG failed verification after 5 attempts ($reason)."
                exit 1
              fi

              delay=$((attempt * 5))
              echo "Attempt $attempt/5 did not verify $package@$PUBLISH_TAG ($reason); retrying in ${delay}s."
              sleep "$delay"
            done

            [ "$verified" = true ]
          done
          # Behavioral smoke testing happens in the pre-publish `smoke` job
          # against the same tarball; this job only confirms registry publish.
