name: Surface Vercel Build Failures

# Why this exists:
#   When a Vercel preview deploy fails, the GitHub check shows only "Deployment has
#   failed" and a link that requires a Vercel login to read. Anyone without dashboard
#   access — including agents working on the repo — cannot tell whether the failure is
#   caused by the PR or is pre-existing, which turns a two-minute question into a
#   guessing game.
#
#   This posts the failing build's error lines directly onto the pull request. If no
#   PR exists yet for the commit — a fleet/batch push can precede `gh pr create` by
#   seconds to minutes — the job retries the PR lookup for a few minutes and then
#   falls back to a commit comment on the SHA, so the diagnosis is never stranded in
#   the Action log (imboard-ai/ai-dossier#567). See
#   docs/explanation/infrastructure-lessons.md → Neon for the most common cause.
#
# The token lives in SSM Parameter Store, not a GitHub secret, so it rotates in the
# same place as everything else. CI reads it via OIDC — no static AWS credentials.
#
# It uses its own role (github-dossier-vercel-logs) rather than the existing
# github-dossier-oidc, deliberately. On a deployment_status event GitHub emits an
# EMPTY ref in the OIDC subject:
#
#     repo:imboard-ai/ai-dossier:ref:
#
# That claim is identical for every deployment_status event in the repo, including
# deployments from FORK pull requests — there is nothing in it to distinguish them.
# Trusting it on github-dossier-oidc would expose the official KMS dossier signing
# key to any fork PR. This role trusts that exact claim (StringEquals, not
# StringLike) and can do exactly one thing: read /dossier/vercel_token.
#
# The job also holds `contents: write` (below) purely for the commit-comment
# fallback — `createCommitComment` has no narrower scope. `deployment_status` runs
# with a write-capable GITHUB_TOKEN even for a fork-originated deployment (same
# fork-reachability note as above), so the script checks the SHA is reachable from a
# branch in THIS repo before it retries or writes anything, and posts only a
# comment — it never checks out or executes repository content.
#
# Setup:
#   1. Store the token:  chamber write dossier vercel_token "<token>"
#      (equivalently: aws ssm put-parameter --name /dossier/vercel_token \
#         --type SecureString --value "<token>")
#   2. Grant the OIDC role ssm:GetParameter on arn:aws:ssm:us-east-1:942039714848:
#      parameter/dossier/vercel_token, plus kms:Decrypt on the key encrypting it.
#
# Until both are done the job logs a warning and exits, so this is safe to merge early.

on:
  deployment_status:

permissions:
  id-token: write        # required to assume the OIDC role
  pull-requests: write
  contents: write        # createCommitComment fallback when no PR exists yet
  deployments: read

env:
  AWS_REGION: us-east-1
  ROLE_ARN: arn:aws:iam::942039714848:role/github-dossier-vercel-logs
  SSM_PARAM: /dossier/vercel_token
  VERCEL_TEAM_SLUG: imboard

jobs:
  report:
    if: github.event.deployment_status.state == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10   # the PR-lookup retry loop below can hold the runner for several minutes
    steps:
      - name: Configure AWS creds via OIDC
        id: aws
        continue-on-error: true          # a missing role must not fail the build
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read Vercel token from SSM
        id: token
        if: steps.aws.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          VALUE=$(aws ssm get-parameter --name "$SSM_PARAM" --with-decryption \
                    --query 'Parameter.Value' --output text 2>/dev/null)
          if [ -z "$VALUE" ] || [ "$VALUE" = "None" ]; then
            echo "::warning::Could not read $SSM_PARAM — skipping build-log reporting."
            exit 0
          fi
          echo "::add-mask::$VALUE"
          echo "token=$VALUE" >> "$GITHUB_OUTPUT"

      - name: Fetch build logs and comment on the PR
        uses: actions/github-script@v7
        env:
          VERCEL_TOKEN: ${{ steps.token.outputs.token }}
          VERCEL_TEAM_SLUG: ${{ env.VERCEL_TEAM_SLUG }}
        with:
          script: |
            const token = process.env.VERCEL_TOKEN;
            if (!token) {
              core.warning('VERCEL_TOKEN is not set — skipping. Add the secret to enable build-log reporting.');
              return;
            }

            const targetUrl = context.payload.deployment_status.target_url || '';
            const envUrl = context.payload.deployment_status.environment_url || '';
            core.info(`target_url=${targetUrl} environment_url=${envUrl}`);

            // deployment_status carries the deployment HOSTNAME as target_url
            // (e.g. dossier-registry-abc123-imboard.vercel.app), not the dashboard
            // URL. The Vercel API accepts either form as {idOrUrl}, so prefer an
            // explicit dpl_/dashboard id when present and otherwise pass the host.
            const source = envUrl || targetUrl;
            const dashboardId = source.match(/vercel\.com\/[^/]+\/[^/]+\/([A-Za-z0-9]{20,})/);
            let deploymentId = dashboardId ? dashboardId[1] : null;
            if (!deploymentId) {
              try {
                deploymentId = new URL(source).host;
              } catch {
                core.warning(`Could not derive a deployment reference from ${source}`);
                return;
              }
            }
            core.info(`resolved deployment reference: ${deploymentId}`);

            // The project belongs to a team, so every call needs the team scope or
            // the API answers as though the resource does not exist — which is how
            // an events fetch came back empty rather than erroring.
            const slug = process.env.VERCEL_TEAM_SLUG;
            const api = async (path) => {
              const url = new URL(`https://api.vercel.com${path}`);
              if (slug) url.searchParams.set('slug', slug);
              const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
              if (!res.ok) throw new Error(`${path} → ${res.status} ${(await res.text()).slice(0, 300)}`);
              return res;
            };

            const repoRef = { owner: context.repo.owner, repo: context.repo.repo };

            // The events endpoint has returned both a JSON array and NDJSON across
            // API versions, and event shapes vary (payload.text vs text). Parse
            // defensively and keep every text line, so a shape change degrades to
            // "slightly noisy output" rather than an empty comment.
            const stripAnsi = (t) => t.replace(/\u001b\[[0-9;]*m/g, '');
            const ERROR_RE = /error|failed|cannot find|not found|exit code|fatal/i;

            // Vercel build logs routinely echo environment values — most relevantly
            // a Neon connection string in exactly the provisioning-failure case this
            // job now detects. Redact before anything is posted to a public comment.
            const redact = (s) => String(s)
              .replace(/\b(postgres(?:ql)?|mysql|mongodb(?:\+srv)?|redis|https?):\/\/[^:@\s/]+:[^@\s]+@/gi, '$1://***:***@')
              .replace(/\b(AKIA|ASIA)[0-9A-Z]{16}\b/g, '$1****************')
              .replace(/\bgh[pousr]_[A-Za-z0-9]{20,}\b/g, 'gh*_***')
              .replace(/\b(bearer|token|api[-_]?key|secret|password)\b(\s*[:=]\s*)\S+/gi, '$1$2***');

            // A fenced code block breaks if the fenced content itself contains a run
            // of backticks as long as the fence — and build output / errorMessage
            // here are fully attacker-controlled (any fork PR can trigger a failing
            // preview). Use a fence longer than the longest backtick run present.
            const fenceFor = (s) => {
              const runs = [...String(s).matchAll(/`+/g)].map((m) => m[0].length);
              return '`'.repeat(Math.max(3, ...runs, 0) + 1);
            };

            // Resolve whatever reference we have (hostname or id) to a canonical
            // dpl_ id; the events endpoint only answers for the latter.
            let failureSummary = '';
            let meta = null;
            try {
              meta = await (await api(`/v13/deployments/${deploymentId}`)).json();
              if (meta?.id) {
                core.info(`resolved ${deploymentId} → ${meta.id} (state=${meta.readyState ?? '?'})`);
                deploymentId = meta.id;
              }
              // A deployment can fail AFTER a clean build (bad config, function init
              // crash, routing error). Build events are empty in that case and the
              // reason only appears here, so surface it either way.
              const bits = [
                meta?.readyState && `state: ${meta.readyState}`,
                meta?.errorCode && `errorCode: ${meta.errorCode}`,
                meta?.errorMessage && `errorMessage: ${meta.errorMessage}`,
                meta?.errorStep && `errorStep: ${meta.errorStep}`,
              ].filter(Boolean);
              if (bits.length) {
                failureSummary = redact(bits.join('\n'));
                core.info(`deployment failure summary:\n${failureSummary}`);
              }
            } catch (err) {
              core.warning(`Could not resolve deployment metadata: ${err.message}`);
            }

            let all = [];
            let eventsError = null;
            try {
              const res = await api(`/v3/deployments/${deploymentId}/events?builds=1&limit=500`);
              const text = await res.text();

              let events = [];
              try {
                const asJson = JSON.parse(text);
                events = Array.isArray(asJson) ? asJson : (asJson.events ?? [asJson]);
              } catch {
                events = text
                  .split('\n')
                  .filter((l) => l.trim())
                  .map((l) => { try { return JSON.parse(l); } catch { return { text: l }; } });
              }

              core.info(`fetched ${events.length} event(s)`);
              for (const ev of events) {
                const t = ev?.payload?.text ?? ev?.text ?? '';
                if (t) all.push({ type: ev.type ?? '', text: stripAnsi(String(t)).trimEnd() });
              }
            } catch (err) {
              // Do not bail here — failureSummary (from the metadata call above) may
              // still carry the Neon-quota diagnosis even though the build-log fetch
              // itself failed, and that is worth posting on its own.
              core.warning(`Could not read deployment events: ${err.message}`);
              eventsError = err.message;
            }

            const errors = all.filter(
              (l) => ['stderr', 'error', 'fatal'].includes(l.type) || ERROR_RE.test(l.text)
            );
            let lines = (errors.length ? errors : all).map((l) => l.text);
            if (errors.length === 0 && all.length > 0) {
              core.info('no error-classified lines; falling back to the build output tail');
            }

            const zeroBuildEvents = lines.length === 0;
            if (zeroBuildEvents) {
              lines = eventsError
                ? [`Build log unavailable — Vercel events API request failed: ${eventsError}`,
                   'The deployment status summary above (if any) is the only signal.']
                : ['No build log events — the build itself did not fail.',
                   'The deployment errored after building, so the reason is in the summary above.'];
            }
            const tail = redact(lines.slice(-40).join('\n').slice(-6000));

            // The exact signature of "Neon preview branch quota exhausted" —
            // see docs/explanation/infrastructure-lessons.md → Neon. Flagging
            // it here saves a human from chasing a build error that isn't one.
            const isNeonQuotaSignature = zeroBuildEvents
              && meta?.errorCode === 'BUILD_FAILED'
              && /resource provisioning failed/i.test(meta?.errorMessage || '');
            core.info(`neon-quota signature: ${isNeonQuotaSignature} (zeroBuildEvents=${zeroBuildEvents} errorCode=${meta?.errorCode ?? 'n/a'} errorMessage=${JSON.stringify(meta?.errorMessage ?? null)})`);

            const sha = context.payload.deployment.sha;

            // deployment_status runs with a write-capable GITHUB_TOKEN even for a
            // fork-originated deployment (see the header comment). Only spend the
            // retry budget and only write a comment for a SHA this repo actually
            // knows about. getCommit resolves any SHA reachable from a ref in this
            // repo — not just current branch tips — so a commit superseded by a
            // later push in a rapid sequence (PR #554's pattern: three pushes in
            // ~10 min) still passes; listBranchesForHeadCommit would not, since it
            // only matches a SHA that is presently a branch HEAD.
            let inThisRepo = true;
            try {
              await github.rest.repos.getCommit({ ...repoRef, ref: sha });
            } catch (err) {
              if (err.status === 404) {
                inThisRepo = false;
              } else {
                core.warning(`Could not verify ${sha} is known to this repo (${err.message}) — proceeding as if it is.`);
              }
            }
            if (!inThisRepo) {
              core.info(`${sha} is not a commit this repo knows about (fork PR or deleted branch) — logging only.`);
              core.info(tail);
              return;
            }

            // Find the PR for this SHA. Under fleet cadence the branch push (which
            // triggers this deployment_status event) can precede `gh pr create` by
            // seconds to minutes — up to ~5 min observed (imboard-ai/ai-dossier#567)
            // — so a PR that doesn't exist yet on the first check may exist shortly
            // after. Budget ~5 min total (10 lookups, 30s apart) with margin over
            // that observed gap; a lookup error counts as "not found yet", not a
            // reason to stop retrying.
            const findOpenPr = async () => {
              try {
                const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ ...repoRef, commit_sha: sha });
                return prs.find((p) => p.state === 'open');
              } catch (err) {
                core.warning(`PR lookup failed for ${sha} (${err.message}) — treating as not-found.`);
                return undefined;
              }
            };
            const PR_LOOKUP_ATTEMPTS = 10;
            const PR_LOOKUP_DELAY_MS = 30_000;
            let pr;
            for (let attempt = 1; attempt <= PR_LOOKUP_ATTEMPTS; attempt++) {
              pr = await findOpenPr();
              if (pr || attempt === PR_LOOKUP_ATTEMPTS) break;
              core.info(`No open PR for ${sha} yet (attempt ${attempt}/${PR_LOOKUP_ATTEMPTS}) — retrying in ${PR_LOOKUP_DELAY_MS / 1000}s.`);
              await new Promise((resolve) => setTimeout(resolve, PR_LOOKUP_DELAY_MS));
            }

            const body = [
              '### ❌ Vercel preview deployment failed',
              '',
              `Deployment: ${targetUrl}`,
              '',
              ...(isNeonQuotaSignature ? ['**Likely cause:** `neon-quota` — see docs/explanation/infrastructure-lessons.md → Neon.', ''] : []),
              ...(failureSummary ? ['**Deployment status**', '', fenceFor(failureSummary), failureSummary, fenceFor(failureSummary), ''] : []),
              'Build output:',
              '',
              fenceFor(tail),
              tail,
              fenceFor(tail),
              '',
              '<sub>Posted automatically so the failure is readable without a Vercel login.</sub>',
            ].join('\n');

            const post = async (what, fn) => {
              try {
                await fn();
                core.info(`posted report via ${what}`);
              } catch (err) {
                core.warning(`Failed to post report via ${what}: ${err.message}`);
                core.info(`--- report body (unposted) ---\n${body}`);
              }
            };

            if (!pr) {
              core.info(`No open PR found for ${sha} after ${PR_LOOKUP_ATTEMPTS} attempts — posting a commit comment instead.`);
              const waitedSec = Math.round((PR_LOOKUP_ATTEMPTS - 1) * PR_LOOKUP_DELAY_MS / 1000);
              const fallbackBody = `${body}\n\n<sub>No open PR was associated with \`${sha}\` after ${PR_LOOKUP_ATTEMPTS} attempts over ~${waitedSec}s, so this is posted on the commit instead.</sub>`;
              await post(`commit comment on ${sha}`, () => github.rest.repos.createCommitComment({ ...repoRef, commit_sha: sha, body: fallbackBody }));
              return;
            }

            await post(`PR #${pr.number} comment`, () => github.rest.issues.createComment({ ...repoRef, issue_number: pr.number, body }));
