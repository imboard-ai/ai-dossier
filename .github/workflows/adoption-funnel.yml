name: Weekly Adoption Funnel

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Post weekly adoption ledger
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ADOPTION_FUNNEL_ISSUE: '985'
        run: node scripts/adoption-funnel.mjs
