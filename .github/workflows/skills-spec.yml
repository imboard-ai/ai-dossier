name: Skills Spec

# Validate example dossiers, rendered as installed skills, against the Agent
# Skills reference validator (https://agentskills.io/specification). #1088.
#
# Two checks:
# - As the CLI writes them (#1123): every example converted to the Agent Skills
#   layout the way `ai-dossier sign`/`format` now write it. REQUIRED.
# - As shipped (#1126): the examples are mirrors of the republished registry
#   dossiers (spec layout, v3 signatures), validated byte-for-byte as they sit
#   in the repo. REQUIRED.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'examples/**'
      - 'cli/src/skill-frontmatter.ts'
      - 'cli/src/commands/sign.ts'
      - 'packages/core/**'
      - 'scripts/validate-skills-spec.mjs'
      - '.github/workflows/skills-spec.yml'
  push:
    branches:
      - main
    paths:
      - 'examples/**'
      - 'cli/src/skill-frontmatter.ts'
      - 'cli/src/commands/sign.ts'
      - 'packages/core/**'
      - 'scripts/validate-skills-spec.mjs'
      - '.github/workflows/skills-spec.yml'
  workflow_dispatch: {}

concurrency:
  group: skills-spec-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Reference validator, pinned to a commit so a change upstream cannot
  # silently change what this job enforces. Bump deliberately.
  SKILLS_REF_SHA: 69ef37e9424c0a7ea9dd2293b559e43ec8176379

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: make build-all

      - name: Install skills-ref
        run: |
          python3 -m venv "$RUNNER_TEMP/skills-ref-venv"
          "$RUNNER_TEMP/skills-ref-venv/bin/pip" install --quiet \
            "git+https://github.com/agentskills/agentskills.git@${SKILLS_REF_SHA}#subdirectory=skills-ref"

      - name: Validate example dossiers as the CLI writes them
        env:
          SKILLS_REF_BIN: ${{ runner.temp }}/skills-ref-venv/bin/skills-ref
        run: |
          set -o pipefail
          status=0
          node scripts/validate-skills-spec.mjs --as-written | tee "$RUNNER_TEMP/skills-spec-written.txt" || status=$?
          {
            echo '### skills-ref validate, as the CLI writes them (required, #1123)'
            echo '```'
            cat "$RUNNER_TEMP/skills-spec-written.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Validate example dossiers as shipped
        env:
          SKILLS_REF_BIN: ${{ runner.temp }}/skills-ref-venv/bin/skills-ref
        run: |
          set -o pipefail
          status=0
          node scripts/validate-skills-spec.mjs | tee "$RUNNER_TEMP/skills-spec.txt" || status=$?
          {
            echo '### skills-ref validate, as shipped'
            echo '```'
            cat "$RUNNER_TEMP/skills-spec.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
