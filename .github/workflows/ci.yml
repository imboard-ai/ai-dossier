name: CI

on:
  pull_request:
    branches:
      - main
    # `labeled`/`unlabeled` are on top of the default set so the `version-bump`
    # job's `no-release-needed` escape label takes effect immediately. Without
    # them, applying the label to an already-red PR re-runs nothing (a manual
    # re-run replays the original event payload, which lacks the new label), so
    # the author would have to push an empty commit to clear the check.
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job here only reads the repository. Pinning this explicitly keeps the
# checked-out PR code (which CI executes) from ever getting a writable
# GITHUB_TOKEN, regardless of the repo-level default workflow permission.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # `npm run lint` is `biome ci --error-on-warnings .`: lint warnings fail this
      # job like errors, so they cannot pile up again (#859). Info-level diagnostics
      # are reported but never fail it; Biome has no flag for that.
      - name: Lint & format check
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: make build-all

      - name: Run tests with coverage
        run: make test-coverage

      # The extension is private (never on npm), so nothing else proves it still packages.
      - name: Package VS Code extension
        if: matrix.node-version == 22
        run: npm run package --workspace=ai-dossier-vscode

  # Guards against the failure in #448: a package's source merges to main with its
  # version unchanged (or bumped to a number the base-branch tip already holds, #826),
  # so npm lags main. The publish workflow used to skip such a package silently
  # (#442, #446); since #826 `scripts/publish-guard.mjs` fails the publish run instead —
  # either way the change is unreleased. Fails the PR while it is still cheap to bump.
  version-bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history so `git merge-base` against the base branch resolves.
          # A shallow clone makes the check unable to run (it exits 2 rather
          # than passing silently).
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Never splice `${{ }}` into a `run:` body: the value is substituted
      # into the script *before* the shell sees it, so PR-controlled data
      # (base ref, labels, titles) would run as shell. Pass it through `env:`
      # and read it as a quoted shell variable instead.
      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch --no-tags origin -- "$BASE_REF"

      - name: Check publishable packages have version bumps
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: node scripts/check-version-bumps.mjs --base "origin/$BASE_REF" --labels "$PR_LABELS"

  # Builds the static site (website/) only when the PR touches it or the docs it renders.
  # The job always runs (so it can be a required check) but skips its build steps otherwise.
  # REGISTRY_OPTIONAL=1: a registry outage must not block unrelated PRs; the site build then
  # has no registry pages (production builds on Vercel fail loudly instead).
  website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect website/docs changes
        id: changes
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags origin -- "$BASE_REF"
          # Capture first: a failing `git diff` inside an `if` pipeline would silently skip the build.
          changed=$(git diff --name-only "origin/$BASE_REF"...HEAD)
          if printf '%s\n' "$changed" | grep -qE '^(website/|docs/|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No website/ or docs/ changes; skipping."
          fi

      - name: Setup Node.js
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install
        if: steps.changes.outputs.run == 'true'
        working-directory: website
        run: npm ci

      - name: Unit tests
        if: steps.changes.outputs.run == 'true'
        working-directory: website
        run: npm test

      - name: Build
        if: steps.changes.outputs.run == 'true'
        working-directory: website
        env:
          REGISTRY_OPTIONAL: '1'
        run: npm run build

      - name: Check internal links
        if: steps.changes.outputs.run == 'true'
        working-directory: website
        run: npm run check:links
