# Capability manifest (docs/reference/capabilities.md).
#
# `test.full` exists so the batch scheduler's aggregate-suite runner
# (cli/src/batch-suite-runner.ts, #562) has a trustworthy tier-1 command for
# this repo. Its command is `scripts/test-report.mjs` (#893), NOT `make test`:
# the runner attributes a red suite to batch members by parsing ONE vitest JSON
# document out of the capability's stdout, and `make test` prints only human
# text — so every red run read as `suite-unreadable` and stranded the batch.
# test-report.mjs runs the same suites (every workspace with a `test` script,
# then the repo-script tests) one at a time, and prints a merged
# `{ testResults: [...] }` report on stdout (human output goes to stderr).
# It takes no flags, so nothing is forwarded through a wrapper (#562).
version: 1

capabilities:
  test.full:
    command: node scripts/test-report.mjs
    lifecycle: active
    description: >-
      Full workspace test suite (all workspaces + repo scripts), emitting one
      merged vitest-JSON report on stdout so a red run is attributable
    # This is the active capability command's own budget. The aggregate runner
    # gives its outer cap-run watchdog bounded setup grace, then treats this
    # timeout as terminal rather than guessing with a fallback command.
    timeout_ms: 600000
    assumptions:
      - file-exists: scripts/test-report.mjs
      - tool-version: node>=20

  # --- The batch incremental member gate (#594 dogfood) ------------------
  #
  # `runIncrementalGate` (packages/sched/src/batch-dispatch.ts) runs a FIXED
  # pair — `typecheck.run` then `test.focused` — after every batch member
  # reports review-done, and branches three ways: `task-failed` evicts the
  # member, `automation-broken`/`capability-unavailable` BLOCK the whole batch
  # (#583/#585), only both-`ok` lets the member complete. Until this repo
  # declared these two ids, every member's gate returned
  # capability-unavailable and any batch enqueued here blocked on member 1 —
  # `test.full` above is the AGGREGATE suite runner's capability (#562), a
  # different call site, and it never satisfied the per-member gate.
  #
  # Order matters and is load-bearing: the gate evaluates the pair in the
  # literal array order above, so `typecheck.run`'s build runs BEFORE
  # `test.focused`. That is not incidental — `make test` on a worktree with
  # stale workspace dists fails wholesale with
  # `usageParserFor is not a function` (packages/sched's vitest resolves
  # @ai-dossier/core through node_modules' built dist, not its src), which
  # would read as a red suite and evict a member whose diff was fine. The
  # build is the gate's own precondition, declared as the first half of it.

  typecheck.run:
    command: make build-all
    lifecycle: active
    description: >-
      Typecheck via the real build (core → worktree-pool → sched →
      mcp-server + cli). This repo has no separate `typecheck` script in any
      workspace — tsc runs as part of `build`, so the build IS the
      typecheck, and `build-all` is the variant that skips lint (`make
      build` = lint + build-all; lint is a separate concern and must not
      fail a member on formatting).
    timeout_ms: 600000
    assumptions:
      - file-exists: Makefile
      - tool-version: node>=20

  test.focused:
    command: node scripts/test-report.mjs --changed
    lifecycle: active
    description: >-
      Per-member gate suite: only the workspaces the member's diff touches
      (plus their dependents), emitting the same one-document JSON report as
      `test.full` so a red run is attributable (#919).
    # The gate calls this with (worktree, id) only — no changed-paths reach a
    # capability — so `--changed` derives them from `git diff` against the
    # merge-base with $TEST_REPORT_BASE / origin/main (plus uncommitted and
    # untracked files) and maps path -> workspace. A workspace also pulls in
    # every workspace that depends on it (a core change runs cli/sched/...);
    # scripts/, docs/ and root markdown run just the repo-script tests; ANY
    # path that maps to nothing (root package.json/lockfile, test-support/,
    # Makefile, .dossier/...) or an unusable git diff falls back to the FULL run,
    # so the failure mode of the mapping is a slow gate, never a lenient one.
    # Suites run sequentially (registry tests are load-sensitive, #893).
    #
    # History: this was `make test` (#594) because imboard's diff-scoped
    # `scripts/cap-test-focused.sh` (`tee /dev/stderr` under `set -o pipefail`)
    # fabricated exit 1 from green runs (imboard-monorepo#3996). The scoping here
    # is plain node with no pipes, and the exit code is the report's `success`.
    timeout_ms: 600000
    assumptions:
      - file-exists: scripts/test-report.mjs
      - tool-version: node>=20

  # --- Lint, exactly as CI runs it (#859) ---------------------------------
  #
  # NOT part of the member gate above (that pair is fixed in code). Declared for
  # the member workflows' own lint step (`ai-dossier cap run lint.run`), whose
  # fallback without it is a bare `biome check --write`, which exits 0 on the
  # warnings CI's lint job fails on.
  lint.run:
    command: npm run lint
    lifecycle: active
    description: >-
      Biome exactly as CI's lint job runs it (`biome ci --error-on-warnings .`):
      format drift, lint errors and lint warnings fail. Repo-wide; the tree has
      been warning-free since #859, so a failure belongs to the change under test.
    assumptions:
      - file-exists: biome.json
      - tool-version: node>=20
